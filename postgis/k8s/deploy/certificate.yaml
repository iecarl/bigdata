apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-tls
  namespace: postgis
spec:
  dnsNames:
  - postgis.localhost
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-cluster-issuer
  privateKey:
    rotationPolicy: Never
  secretName: postgis-tls