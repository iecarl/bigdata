apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongodb-tls
  namespace: mongodb
spec:
  dnsNames:
  - mongodb.example.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-cluster-issuer
  privateKey:
    rotationPolicy: Never
  secretName: mongodb-tls