apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
  name: mssql-pv
  namespace: mssql
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 50Gi
  claimRef:
    name: mssql-pvc
    namespace: mssql
  csi:
    driver: file.csi.azure.com
    volumeAttributes: 
      resourceGroup: {"resource_group_name"}_{"location"}
      storageAccount: {"storage_account_name"}
      shareName: {"share_name"}
      folderName: mssql # MSSQL database folder
      server: {"storage_account_name"}.file.core.windows.net
      secretnamespace: mssql
      secretName: mssql-storage-secret
      skuName: Standard_LRS
    volumeHandle: {"resource_group_name"}_{"location"}#{"storage_account_name"}#{"share_name"}#mssql
    nodeStageSecretRef:
      name: mssql-storage-secret
      namespace: mssql
  mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=10001
  - gid=10001
  - cache=strict
  - mfsymlinks
  - nosharesock
  - nobrl
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile
  volumeMode: Filesystem